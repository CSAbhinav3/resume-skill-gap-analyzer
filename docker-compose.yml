version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-gap-api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/dev.db}
      - TAXONOMY_EMB_PATH=data/taxonomy/embeddings.npy
      - TAXONOMY_IDS_PATH=data/taxonomy/skill_ids.json
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.65}
      - MAX_MISSING_SKILLS=${MAX_MISSING_SKILLS:-15}
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./data/eval_outputs:/app/data/eval_outputs
      - resume_db:/app/data
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-gap-streamlit
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/dev.db}
      - TAXONOMY_EMB_PATH=data/taxonomy/embeddings.npy
      - TAXONOMY_IDS_PATH=data/taxonomy/skill_ids.json
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.65}
      - MAX_MISSING_SKILLS=${MAX_MISSING_SKILLS:-15}
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./data/eval_outputs:/app/data/eval_outputs
      - resume_db:/app/data
    command: ["streamlit", "run", "streamlit_app.py",
              "--server.port=8501",
              "--server.address=0.0.0.0",
              "--server.headless=true"]
    restart: unless-stopped

volumes:
  resume_db:
    driver: local